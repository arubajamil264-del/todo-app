{% extends "base.html" %}
{% block title %} Tasks {% endblock %}
{% block content %}
<div class="task-box">
    <h2>Your Tasks</h2>
    <form action="{{url_for('tasks.add_task')}}" method="post" class="task-form">
        <input type="text" name="title" placeholder="Enter a new task" required>
        <button type="submit" class="btn">Add Task</button>

    </form>
    {% if tasks %}
    <form method="POST" action="{{url_for('tasks.clear_tasks')}}">
        <button type="submit" class="btn btn-clear">Clear All Tasks</button>
    </form>
    <br>
    <table>
        <thead>
            <tr>
                <th>Task</th>
                <th>Status</th>
                <th>Change</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr>
                <td>{{loop.index}}</td>
                <td>
                    <span class="badge {{task.status|lower}}">{{task.status}}</span>
                </td>
                <td>
                    <form action="{{url_for('tasks.toggle_task',task_id=task.id)}}"method="post">
                        <button type="submit" class="btn-small">Next</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No tasks available. Add a new task above.</p>
    {% endif %}
</div>
{% endblock %}
